<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chuẩn bị Tết Nguyên Đán</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #fdf5e6;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 16px;
      }

      .card {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        width: 100%;
        max-width: 520px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      .card-header {
        background-color: #c0392b;
        color: white;
        text-align: center;
        padding: 24px 20px;
      }

      .card-header h1 {
        font-size: 26px;
        margin-bottom: 4px;
      }

      .card-header p {
        font-size: 15px;
        opacity: 0.9;
      }

      .card-body {
        padding: 20px;
        background: #fffdf5;
      }

      .todo-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .todo-item {
        background: #fffde7;
        border-left: 4px solid #e67e22;
        border-radius: 10px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        transition:
          background 0.25s,
          border-color 0.25s;
        border: 1.5px solid #f5e6a3;
        border-left: 4px solid #e67e22;
      }

      .todo-item:hover {
        filter: brightness(0.97);
      }

      .todo-item.done {
        background: #eafaf1;
        border-color: #a9dfbf;
        border-left-color: #27ae60;
      }

      .todo-item.done .todo-task {
        text-decoration: line-through;
        color: #7f8c8d;
      }

      .todo-check {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid #bbb;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        transition:
          background 0.2s,
          border-color 0.2s;
      }

      .todo-item.done .todo-check {
        background: #27ae60;
        border-color: #27ae60;
      }

      .todo-check svg {
        display: none;
      }

      .todo-item.done .todo-check svg {
        display: block;
      }
      .todo-task {
        font-size: 16px;
        color: #333;
        transition: color 0.2s;
      }
      .card-footer {
        text-align: center;
        padding: 14px 20px;
        font-size: 13px;
        color: #aaa;
        border-top: 1px solid #f0e0cc;
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <h1>Công việc chuẩn bị Tết</h1>
        <p>Click để đánh dấu hoàn thành</p>
      </div>
      <div class="card-body">
        <ul class="todo-list" id="todo-list"></ul>
      </div>
      <div class="card-footer" id="footer-msg">
        Trạng thái được lưu tự động vào localStorage • Refresh để kiểm tra
      </div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
