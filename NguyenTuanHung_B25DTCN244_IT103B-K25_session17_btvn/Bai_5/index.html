<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chuẩn bị Tết Nguyên Đán</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: #fdf5e6;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 16px;
      }
      .card {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        width: 100%;
        max-width: 520px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .card-header {
        background-color: #c0392b;
        color: white;
        text-align: center;
        padding: 24px 20px;
      }
      .card-header h1 {
        font-size: 26px;
        margin-bottom: 4px;
      }
      .card-header p {
        font-size: 15px;
        opacity: 0.9;
      }
      .card-body {
        padding: 20px;
        background: #fffdf5;
      }
      .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      #todo-input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
      }
      #add-btn {
        background-color: #f39c12;
        color: white;
        border: none;
        padding: 0 20px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
      }
      .todo-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .todo-item {
        background: #fffde7;
        border: 1.5px solid #f5e6a3;
        border-left: 4px solid #e67e22;
        border-radius: 10px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        min-height: 56px;
      }
      .todo-item.done {
        background: #eafaf1;
        border-color: #a9dfbf;
        border-left-color: #27ae60;
      }
      .todo-item.done .todo-task {
        text-decoration: line-through;
        color: #7f8c8d;
      }
      .todo-check {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid #bbb;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      .todo-item.done .todo-check {
        background: #27ae60;
        border-color: #27ae60;
      }
      .todo-check svg {
        display: none;
        width: 16px;
        height: 16px;
        fill: white;
      }
      .todo-item.done .todo-check svg {
        display: block;
      }

      .todo-task {
        font-size: 16px;
        color: #333;
        flex: 1;
      }

      .edit-input {
        flex: 1;
        padding: 8px 12px;
        font-size: 16px;
        border: 1px solid #3498db;
        border-radius: 4px;
        outline: none;
        background: white;
      }

      .action-btns {
        display: flex;
        gap: 8px;
      }
      .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
        padding: 4px;
        opacity: 0.4;
        transition: opacity 0.2s;
      }
      .btn-icon:hover {
        opacity: 1;
      }

      .card-footer {
        text-align: center;
        padding: 14px 20px;
        font-size: 13px;
        color: #aaa;
        border-top: 1px solid #f0e0cc;
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <h1>Công việc chuẩn bị Tết</h1>
        <p>Thêm - Chỉnh sửa - Đánh dấu - Xóa công việc</p>
      </div>
      <div class="card-body">
        <div class="input-group">
          <input
            type="text"
            id="todo-input"
            placeholder="Nhập công việc mới..."
            autocomplete="off"
          />
          <button id="add-btn">Thêm</button>
        </div>
        <ul class="todo-list" id="todo-list"></ul>
      </div>
      <div class="card-footer">
        Mọi thay đổi (thêm / chỉnh sửa / đánh dấu / xóa) được lưu tự động vào
        localStorage • Refresh để kiểm tra
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
