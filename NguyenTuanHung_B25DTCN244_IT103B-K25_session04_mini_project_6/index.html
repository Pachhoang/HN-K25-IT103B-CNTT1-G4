<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản Lý Nhân Viên</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --primary: #2563eb;
        --danger: #dc2626;
        --bg: #f4f4f5;
        --surface: #ffffff;
        --border: #e5e7eb;
        --text: #111827;
        --muted: #9ca3af;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px 16px;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
      }
      .form-section,
      .table-section {
        background: var(--surface);
        border-radius: 8px;
        padding: 20px;
        border: 1px solid var(--border);
        margin-bottom: 20px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 0.9rem;
        font-weight: 500;
      }
      .required {
        color: var(--danger);
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--primary);
      }

      .error {
        color: var(--danger);
        font-size: 0.75rem;
        display: block;
        margin-top: 4px;
        height: 14px;
      }

      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .btn {
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        border: none;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
      }
      .btn-secondary {
        background: #e5e7eb;
        color: #4b5563;
      }
      .hidden {
        display: none;
      }

      .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .badge {
        background: #eff6ff;
        color: var(--primary);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      thead {
        background: #f9fafb;
      }

      .btn-sm {
        padding: 5px 12px;
        font-size: 0.8rem;
        border-radius: 4px;
        margin-right: 5px;
      }
      .btn-edit {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #bbf7d0;
      }
      .btn-delete {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }

      .footer {
        text-align: right;
        color: var(--muted);
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 id="form-title">Quản Lý Nhân Viên</h1>
      </header>

      <section class="form-section">
        <form id="employee-form">
          <div class="form-grid">
            <div class="form-group">
              <label>Họ và tên <span class="required">*</span></label>
              <input type="text" id="fullName" placeholder="Nhập họ và tên" />
              <span class="error" id="error-fullName"></span>
            </div>

            <div class="form-group">
              <label>Email <span class="required">*</span></label>
              <input type="email" id="email" placeholder="vd: ten@gmail.com" />
              <span class="error" id="error-email"></span>
            </div>

            <div class="form-group">
              <label>Ngày sinh <span class="required">*</span></label>
              <input type="date" id="dateOfBirth" />
              <span class="error" id="error-dateOfBirth"></span>
            </div>

            <div class="form-group">
              <label>Chức vụ <span class="required">*</span></label>
              <select id="position">
                <option value="">-- Chọn chức vụ --</option>
                <option value="Nhân viên">Nhân viên</option>
                <option value="Trưởng nhóm">Trưởng nhóm</option>
                <option value="Trưởng phòng">Trưởng phòng</option>
                <option value="Giám đốc">Giám đốc</option>
              </select>
              <span class="error" id="error-position"></span>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">
              Thêm Nhân Viên
            </button>
            <button
              type="button"
              id="cancel-edit-btn"
              class="btn btn-secondary hidden"
            >
              Hủy Bỏ
            </button>
            <button type="reset" id="reset-btn" class="btn btn-secondary">
              Nhập Lại
            </button>
          </div>
        </form>
      </section>

      <section class="table-section">
        <div class="table-header">
          <h2>Danh Sách Nhân Viên</h2>
          <span class="badge" id="employee-count">0 nhân viên</span>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Họ và tên</th>
                <th>Email</th>
                <th>Ngày sinh</th>
                <th>Chức vụ</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="employee-tbody">
            </tbody>
          </table>
        </div>
      </section>

      <footer class="footer">
        <span id="footer-count">Tổng số nhân viên: 0</span>
      </footer>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
